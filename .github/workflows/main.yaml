name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    name: Node ${{matrix.node_version}} on ${{matrix.os}}
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node_version: [16, 18, 20]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup env
        uses: the-guild-org/shared-config/setup@1c4632ccc198d4c9b34d9e6b3d556c6f245b4e69 # main
        with:
          packageManager: 'pnpm'
          nodeVersion: ${{matrix.node_version}}

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Integrity check
        run: npx bob check